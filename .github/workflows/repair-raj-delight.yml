name: Repair Raj Delight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known broken sources and theme toggle
        run: python scripts/repair-raj-delight.py

      - name: Commit repairs when needed
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/RajDelightPremium.tsx
          git commit -m "fix: harden theme toggle and repair dish imagery"
          git push
